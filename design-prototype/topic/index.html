        <svg class="logo__full" viewBox="0 0 440 112" aria-hidden="true" focusable="false">

            <path d="M12 6 H32 V11 H30 V22 L36 30 H24 V36 H40.5 L45 42 H24 V46 H14 V11 H12 Z" fill="#3B4CFF"/>

          <path d="M7 12h10"/>

    <a class="btn btn--primary btn--large" href="../lab/index.html" data-sticky-link>3D laboratoriyani ochish</a>
  </div>

  <script src="../class-plan/data.js"></script>
