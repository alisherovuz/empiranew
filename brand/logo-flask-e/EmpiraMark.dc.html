<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 64 64" style="display:block;overflow:visible">
<sc-if value="{{ isFlask }}" hint-placeholder-val="{{ false }}"><g transform="translate(-2.5 0)"><path d="M12 6 H32 V11 H30 V22 L36 30 H24 V36 H40.5 L45 42 H24 V46 H14 V11 H12 Z" fill="{{ main }}"></path><path d="M14 49 H50.25 L57 58 H14 Z" fill="{{ accent }}"></path></g></sc-if>
<sc-if value="{{ isCircuit }}" hint-placeholder-val="{{ false }}"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M48 13 H17 V51 H48" stroke="{{ main }}" stroke-width="7"></path><path d="M17 32 H34" stroke="{{ main }}" stroke-width="7"></path></g><circle cx="17" cy="32" r="5.5" fill="{{ main }}"></circle><circle cx="41" cy="32" r="7.5" fill="{{ accent }}"></circle><sc-if value="{{ showHalo }}" hint-placeholder-val="{{ false }}"><circle cx="41" cy="32" r="12.5" fill="none" stroke="{{ accent }}" stroke-width="2.5"></circle></sc-if></sc-if>
<sc-if value="{{ isSpark }}" hint-placeholder-val="{{ false }}"><ellipse cx="32" cy="32" rx="28" ry="10.5" transform="rotate(-35 32 32)" fill="none" stroke="{{ main }}" stroke-width="{{ ringW }}"></ellipse><path d="M32 11 C32 26 38 32 53 32 C38 32 32 38 32 53 C32 38 26 32 11 32 C26 32 32 26 32 11 Z" fill="{{ accent }}"></path></sc-if>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;concept&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;flask&quot;,&quot;circuit&quot;,&quot;spark&quot;],&quot;default&quot;:&quot;circuit&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;main&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3B4CFF&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFB21E&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:64,&quot;tsType&quot;:&quot;number&quot;},&quot;small&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const c = this.props.concept || 'circuit';
    const small = !!this.props.small;
    return {
      isFlask: c === 'flask', isCircuit: c === 'circuit', isSpark: c === 'spark',
      showHalo: c === 'circuit' && !small,
      ringW: small ? 6 : 4.5,
      size: this.props.size ?? 64,
      main: this.props.main ?? '#3B4CFF',
      accent: this.props.accent ?? '#FFB21E'
    };
  }
}
</script>
</body>
</html>
